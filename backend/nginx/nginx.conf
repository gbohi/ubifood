# ============================================================
# Nginx — reverse proxy devant Django/Gunicorn
#
# Étape 1 (actuelle) : HTTP seul, sur l'IP du serveur.
# Étape 2 : dès qu'un nom de domaine pointe sur le serveur, obtenir un
# certificat Let's Encrypt (voir README), puis décommenter le bloc HTTPS
# ci-dessous, activer la redirection HTTP → HTTPS et mettre USE_HTTPS=True
# dans le .env.
# ============================================================

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Validation Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Étape 2 : décommenter pour forcer HTTPS
    # location / { return 301 https://$host$request_uri; }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

