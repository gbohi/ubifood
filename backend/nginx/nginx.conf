# ============================================================
# Nginx — point d'entrée unique du serveur
#   /            → site web Angular (fichiers statiques)
#   /api/        → API Django (Gunicorn)
#   /admin/      → administration Django
#   /static/     → fichiers statiques Django (admin)
#   /media/      → fichiers uploadés (photos de plats, documents,
#                  APK de l'application mobile sous /media/application/)
#
# Le web et l'API partagent la même origine : pas de CORS à configurer
# pour le site, et l'URL de l'API du web est relative (environment.prod.ts).
#
# Étape 1 (actuelle) : HTTP seul.
# Étape 2 : dès qu'un nom de domaine pointe sur le serveur, obtenir un
# certificat Let's Encrypt (voir README), puis décommenter le bloc HTTPS
# ci-dessous, activer la redirection HTTP → HTTPS et mettre USE_HTTPS=True
# dans le .env.
# ============================================================

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Validation Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Étape 2 : décommenter pour forcer HTTPS (et supprimer les blocs suivants)
    # location / { return 301 https://$host$request_uri; }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # APK de l'application mobile (page /telecharger) : téléchargé, pas affiché,
    # avec le type reconnu par Android. Pas de cache long : l'URL porte ?v=
    location ~* ^/media/application/[^/]+\.apk$ {
        root /app;
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        expires 1h;
    }

    # Dépôt de l'APK par un administrateur (Paramètres → Application mobile) :
    # jusqu'à 200 Mo, et plus de temps pour les connexions lentes
    location = /api/api/application-mobile/ {
        client_max_body_size 200M;
        client_body_timeout   300s;
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Site Angular : toute autre URL renvoie index.html (routage côté client)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache : une mise à jour du site est visible tout de suite
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}

