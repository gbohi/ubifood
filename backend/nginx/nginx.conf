server {
    # Nginx écoute sur le port 80 (HTTP)
    listen 80;

    # Accepte toutes les requêtes (IP ou domaine)
    server_name _;

    # ============================================================
    # Fichiers statiques Django
    # (interface admin, CSS, JS de Django)
    # Nginx les sert directement sans passer par Django
    # ============================================================
    location /static/ {
        alias /app/staticfiles/;
    }

    # ============================================================
    # Fichiers media
    # (images uploadées par les utilisateurs)
    # Nginx les sert directement sans passer par Django
    # ============================================================
    location /media/ {
        alias /app/media/;
    }

    # ============================================================
    # Toutes les autres requêtes → transmises à Django/Gunicorn
    # "backend" = nom du service dans docker-compose.yml
    # port 8000 = port Gunicorn dans le container
    # ============================================================
    location / {
        proxy_pass http://backend:8000;

        # Transmet les vraies infos du client à Django
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts pour éviter les requêtes bloquées
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Taille max des uploads (ex: photos de plats)
        client_max_body_size 20M;
    }
}