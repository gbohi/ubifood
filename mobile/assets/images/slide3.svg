<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#092440"/>
      <stop offset="100%" style="stop-color:#0a2d52"/>
    </linearGradient>
    <linearGradient id="plate3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6c8"/>
      <stop offset="100%" style="stop-color:#e8d5a8"/>
    </linearGradient>
    <radialGradient id="steam3" cx="50%" cy="100%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="400" height="200" fill="url(#bg3)" rx="20"/>

  <!-- Cercles lumineux bg -->
  <circle cx="280" cy="100" r="130" fill="#5BD988" opacity="0.04"/>
  <circle cx="280" cy="100" r="90" fill="#5BD988" opacity="0.05"/>
  <circle cx="280" cy="100" r="55" fill="#5BD988" opacity="0.06"/>

  <!-- Assiette principale -->
  <ellipse cx="285" cy="118" rx="80" ry="14" fill="#000" opacity="0.2"/>
  <circle cx="285" cy="100" r="72" fill="url(#plate3)" opacity="0.15"/>
  <circle cx="285" cy="100" r="72" fill="none" stroke="#e8d5a8" stroke-width="1.5" opacity="0.3"/>
  <circle cx="285" cy="100" r="62" fill="none" stroke="#e8d5a8" stroke-width="0.5" opacity="0.2"/>

  <!-- Nourriture stylisée sur l'assiette -->
  <!-- Riz / grain -->
  <ellipse cx="285" cy="105" rx="42" ry="22" fill="#f5e6c8" opacity="0.2"/>
  <!-- Légumes couleurs -->
  <circle cx="268" cy="98" r="9" fill="#e74c3c" opacity="0.7"/>
  <circle cx="285" cy="92" r="10" fill="#f39c12" opacity="0.75"/>
  <circle cx="303" cy="97" r="8" fill="#27ae60" opacity="0.7"/>
  <circle cx="275" cy="112" r="7" fill="#8e44ad" opacity="0.65"/>
  <circle cx="296" cy="113" r="9" fill="#e67e22" opacity="0.7"/>
  <!-- Herbes -->
  <path d="M280,88 Q283,82 286,88" stroke="#5BD988" stroke-width="2" fill="none"/>
  <path d="M291,88 Q294,82 297,88" stroke="#5BD988" stroke-width="2" fill="none"/>

  <!-- Vapeur -->
  <path d="M270,68 Q268,58 272,50 Q276,42 274,34" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>
  <path d="M285,65 Q283,55 287,47 Q291,39 289,31" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.2" stroke-linecap="round"/>
  <path d="M300,68 Q298,58 302,50 Q306,42 304,34" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.25" stroke-linecap="round"/>

  <!-- Fourchette et couteau -->
  <g transform="translate(358,60)" opacity="0.7">
    <rect x="-2" y="0" width="4" height="80" rx="2" fill="#c0c0c0"/>
    <path d="M-2,0 Q-6,-10 -4,-20 Q0,-25 4,-20 Q6,-10 2,0" fill="#c0c0c0"/>
  </g>
  <g transform="translate(375,60)" opacity="0.7">
    <rect x="-2" y="0" width="4" height="80" rx="2" fill="#c0c0c0"/>
    <rect x="-1.5" y="-8" width="3" height="12" rx="1.5" fill="#c0c0c0"/>
    <rect x="-4" y="-8" width="2.5" height="8" rx="1" fill="#c0c0c0"/>
    <rect x="1.5" y="-8" width="2.5" height="8" rx="1" fill="#c0c0c0"/>
  </g>

  <!-- Textes -->
  <text x="24" y="48" font-family="Arial" font-size="11" fill="#5BD988" font-weight="700" letter-spacing="2">CHAQUE JOUR</text>
  <text x="24" y="78" font-family="'Georgia', serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Un repas</text>
  <text x="24" y="105" font-family="'Georgia', serif" font-size="26" font-weight="700" fill="#5BD988">savoureux</text>
  <text x="24" y="130" font-family="Arial" font-size="12" fill="#ffffff" opacity="0.7">vous attend à la cantine</text>

  <!-- Étoiles notation -->
  <g transform="translate(24,148)">
    <text font-size="16" fill="#FFD700">★★★★★</text>
  </g>
  <text x="24" y="178" font-family="Arial" font-size="11" fill="#ffffff" opacity="0.5">Réservez avant 48h</text>

  <!-- Badge -->
  <rect x="24" y="155" width="0" height="0" rx="0" fill="none"/>
</svg>
