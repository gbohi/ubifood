<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#061728"/>
      <stop offset="50%" style="stop-color:#092440"/>
      <stop offset="100%" style="stop-color:#0f3a6e"/>
    </linearGradient>
    <linearGradient id="btn4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5BD988"/>
      <stop offset="100%" style="stop-color:#3ec970"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3360"/>
      <stop offset="100%" style="stop-color:#092440"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect width="400" height="200" fill="url(#bg4)" rx="20"/>

  <!-- Grille de points décoratifs -->
  <g opacity="0.1" fill="#5BD988">
    <circle cx="310" cy="20" r="2"/><circle cx="330" cy="20" r="2"/><circle cx="350" cy="20" r="2"/><circle cx="370" cy="20" r="2"/>
    <circle cx="310" cy="40" r="2"/><circle cx="330" cy="40" r="2"/><circle cx="350" cy="40" r="2"/><circle cx="370" cy="40" r="2"/>
    <circle cx="310" cy="60" r="2"/><circle cx="330" cy="60" r="2"/><circle cx="350" cy="60" r="2"/><circle cx="370" cy="60" r="2"/>
    <circle cx="310" cy="80" r="2"/><circle cx="330" cy="80" r="2"/><circle cx="350" cy="80" r="2"/><circle cx="370" cy="80" r="2"/>
  </g>

  <!-- Grande horloge décorative -->
  <circle cx="340" cy="130" r="65" fill="none" stroke="#5BD988" stroke-width="0.5" opacity="0.2"/>
  <circle cx="340" cy="130" r="55" fill="none" stroke="#5BD988" stroke-width="0.5" opacity="0.15"/>
  <!-- Marqueurs heure -->
  <g stroke="#5BD988" stroke-width="2" opacity="0.3">
    <line x1="340" y1="76" x2="340" y2="82"/>
    <line x1="340" y1="178" x2="340" y2="184"/>
    <line x1="286" y1="130" x2="292" y2="130"/>
    <line x1="388" y1="130" x2="394" y2="130"/>
  </g>
  <!-- Aiguilles -->
  <line x1="340" y1="130" x2="340" y2="92" stroke="#5BD988" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="340" y1="130" x2="370" y2="130" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <circle cx="340" cy="130" r="4" fill="#5BD988" opacity="0.7"/>

  <!-- Cartes flottantes gauche -->
  <!-- Carte commande -->
  <g filter="url(#cardShadow)">
    <rect x="22" y="30" width="165" height="52" rx="12" fill="url(#card4)" opacity="0.95"/>
    <rect x="22" y="30" width="165" height="52" rx="12" fill="none" stroke="#5BD988" stroke-width="0.5" opacity="0.3"/>
    <!-- Icône -->
    <rect x="34" y="41" width="28" height="28" rx="8" fill="#5BD988" opacity="0.15"/>
    <text x="48" y="60" font-size="14" text-anchor="middle" fill="#5BD988">🍽</text>
    <text x="74" y="50" font-family="Arial" font-size="9" fill="#ffffff" opacity="0.6">Commande du jour</text>
    <text x="74" y="65" font-family="Arial" font-size="13" fill="#5BD988" font-weight="700">Poulet rôti</text>
    <!-- Badge statut -->
    <rect x="155" y="37" width="26" height="13" rx="6" fill="#5BD988" opacity="0.2"/>
    <text x="168" y="47" font-family="Arial" font-size="7" fill="#5BD988" text-anchor="middle" font-weight="600">✓ OK</text>
  </g>

  <!-- Carte délai -->
  <g filter="url(#cardShadow)">
    <rect x="22" y="92" width="165" height="48" rx="12" fill="url(#card4)" opacity="0.95"/>
    <rect x="22" y="92" width="165" height="48" rx="12" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
    <rect x="34" y="102" width="28" height="28" rx="8" fill="#FFD700" opacity="0.1"/>
    <text x="48" y="121" font-size="14" text-anchor="middle" fill="#FFD700">⏰</text>
    <text x="74" y="111" font-family="Arial" font-size="9" fill="#ffffff" opacity="0.6">Délai de commande</text>
    <text x="74" y="127" font-family="Arial" font-size="12" fill="#FFD700" font-weight="700">48h avant le menu</text>
  </g>

  <!-- Carte notification -->
  <g filter="url(#cardShadow)">
    <rect x="22" y="150" width="165" height="38" rx="12" fill="url(#card4)" opacity="0.95"/>
    <rect x="22" y="150" width="165" height="38" rx="12" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    <circle cx="48" cy="169" r="12" fill="#5BD988" opacity="0.15"/>
    <text x="48" y="173" font-size="12" text-anchor="middle" fill="#5BD988">👥</text>
    <text x="68" y="165" font-family="Arial" font-size="9" fill="#ffffff" opacity="0.5">Équipe connectée</text>
    <text x="68" y="179" font-family="Arial" font-size="11" fill="#ffffff" font-weight="600">Toutes les agences</text>
  </g>

  <!-- Texte principal -->
  <text x="205" y="170" font-family="Arial" font-size="10" fill="#5BD988" text-anchor="middle" font-weight="700" letter-spacing="1.5">NE RATEZ PLUS</text>
  <text x="205" y="185" font-family="'Georgia'" font-size="13" fill="#ffffff" text-anchor="middle">votre repas du midi !</text>

  <!-- Bouton CTA -->
  <rect x="210" y="170" width="0" height="0" rx="0"/>
</svg>
