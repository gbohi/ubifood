<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5BD988"/>
      <stop offset="50%" style="stop-color:#3ec970"/>
      <stop offset="100%" style="stop-color:#2aaa58"/>
    </linearGradient>
    <linearGradient id="phone2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3360"/>
      <stop offset="100%" style="stop-color:#092440"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fond vert -->
  <rect width="400" height="200" fill="url(#bg2)" rx="20"/>

  <!-- Motif géométrique fond -->
  <circle cx="350" cy="160" r="100" fill="#ffffff" opacity="0.06"/>
  <circle cx="350" cy="160" r="70" fill="#ffffff" opacity="0.05"/>
  <circle cx="50" cy="30" r="60" fill="#092440" opacity="0.08"/>
  <circle cx="50" cy="30" r="40" fill="#092440" opacity="0.06"/>

  <!-- Hexagones décoratifs -->
  <polygon points="290,20 310,10 330,20 330,40 310,50 290,40" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-width="0.5"/>
  <polygon points="360,60 374,52 388,60 388,76 374,84 360,76" fill="#ffffff" opacity="0.06"/>

  <!-- Téléphone stylisé -->
  <g filter="url(#shadow2)">
    <rect x="248" y="18" width="88" height="164" rx="14" fill="url(#phone2)"/>
    <rect x="252" y="22" width="80" height="156" rx="11" fill="#0a1e35"/>
    <!-- Encoche -->
    <rect x="275" y="24" width="34" height="8" rx="4" fill="#061220"/>
    <!-- Écran app -->
    <rect x="255" y="36" width="74" height="132" rx="6" fill="#0d2a4a"/>
    <!-- Header app -->
    <rect x="255" y="36" width="74" height="28" rx="6" fill="#092440"/>
    <text x="292" y="54" font-family="Arial" font-size="7" fill="#5BD988" text-anchor="middle" font-weight="bold">UbiFood</text>
    <!-- Contenu app -->
    <rect x="260" y="70" width="64" height="18" rx="4" fill="#5BD988" opacity="0.9"/>
    <text x="292" y="82" font-family="Arial" font-size="6" fill="#092440" text-anchor="middle" font-weight="bold">Commander</text>
    <rect x="260" y="94" width="64" height="12" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="260" y="112" width="64" height="12" rx="3" fill="#ffffff" opacity="0.1"/>
    <rect x="260" y="130" width="40" height="12" rx="3" fill="#5BD988" opacity="0.3"/>
    <!-- Icône check -->
    <circle cx="340" cy="148" r="8" fill="#5BD988" opacity="0.9"/>
    <polyline points="336,148 339,151 345,145" stroke="#092440" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Texte gauche -->
  <text x="24" y="45" font-family="Arial, sans-serif" font-size="11" fill="#092440" font-weight="700" opacity="0.8">DÉCOUVREZ</text>
  <text x="24" y="68" font-family="'Georgia', serif" font-size="24" font-weight="700" fill="#092440" letter-spacing="-0.5">UbiFood</text>
  <text x="24" y="86" font-family="Arial, sans-serif" font-size="11" fill="#092440" opacity="0.8">L'appli cantine intelligente</text>

  <!-- Avantages -->
  <g fill="#092440">
    <!-- Avantage 1 -->
    <circle cx="34" cy="106" r="8" fill="#092440" opacity="0.15"/>
    <text x="34" y="110" font-size="9" text-anchor="middle" font-weight="bold">✓</text>
    <text x="48" y="110" font-family="Arial" font-size="11" font-weight="600">Commander en 2 clics</text>

    <!-- Avantage 2 -->
    <circle cx="34" cy="126" r="8" fill="#092440" opacity="0.15"/>
    <text x="34" y="130" font-size="9" text-anchor="middle" font-weight="bold">✓</text>
    <text x="48" y="130" font-family="Arial" font-size="11" font-weight="600">Menus à la semaine</text>

    <!-- Avantage 3 -->
    <circle cx="34" cy="146" r="8" fill="#092440" opacity="0.15"/>
    <text x="34" y="150" font-size="9" text-anchor="middle" font-weight="bold">✓</text>
    <text x="48" y="150" font-family="Arial" font-size="11" font-weight="600">Retrait par badge QR</text>

    <!-- Avantage 4 -->
    <circle cx="34" cy="166" r="8" fill="#092440" opacity="0.15"/>
    <text x="34" y="170" font-size="9" text-anchor="middle" font-weight="bold">✓</text>
    <text x="48" y="170" font-family="Arial" font-size="11" font-weight="600">Factures mensuelles PDF</text>
  </g>
</svg>
