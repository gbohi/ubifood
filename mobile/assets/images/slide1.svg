<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#092440"/>
      <stop offset="60%" style="stop-color:#0d3360"/>
      <stop offset="100%" style="stop-color:#1a5a8a"/>
    </linearGradient>
    <linearGradient id="sun1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#5BD988;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#5BD988;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- Fond -->
  <rect width="400" height="200" fill="url(#bg1)" rx="20"/>
  <rect width="400" height="200" fill="url(#glow1)" rx="20"/>

  <!-- Cercles décoratifs -->
  <circle cx="340" cy="30" r="80" fill="none" stroke="#5BD988" stroke-width="0.5" opacity="0.3"/>
  <circle cx="340" cy="30" r="55" fill="none" stroke="#5BD988" stroke-width="0.5" opacity="0.2"/>
  <circle cx="340" cy="30" r="30" fill="#5BD988" opacity="0.08"/>

  <!-- Soleil stylisé -->
  <circle cx="330" cy="48" r="28" fill="url(#sun1)" opacity="0.9"/>
  <!-- Rayons soleil -->
  <g transform="translate(330,48)" stroke="#FFD700" stroke-width="2.5" opacity="0.7">
    <line x1="0" y1="-38" x2="0" y2="-33"/>
    <line x1="0" y1="33" x2="0" y2="38"/>
    <line x1="-38" y1="0" x2="-33" y2="0"/>
    <line x1="33" y1="0" x2="38" y2="0"/>
    <line x1="-27" y1="-27" x2="-23" y2="-23"/>
    <line x1="23" y1="23" x2="27" y2="27"/>
    <line x1="27" y1="-27" x2="23" y2="-23"/>
    <line x1="-23" y1="23" x2="-27" y2="27"/>
  </g>

  <!-- Personnes silhouettes fête -->
  <!-- Personne 1 -->
  <g transform="translate(60,95)">
    <circle cx="0" cy="-45" r="12" fill="#5BD988"/>
    <path d="M-12,-33 Q0,-20 12,-33 L16,5 Q0,12 -16,5 Z" fill="#5BD988" opacity="0.9"/>
    <line x1="-16" y1="-10" x2="-28" y2="5" stroke="#5BD988" stroke-width="5" stroke-linecap="round"/>
    <line x1="16" y1="-10" x2="32" y2="-18" stroke="#5BD988" stroke-width="5" stroke-linecap="round"/>
    <!-- Bras levé avec fleur -->
    <circle cx="32" cy="-22" r="6" fill="#FFD700"/>
    <line x1="32" y1="-16" x2="32" y2="-10" stroke="#FFD700" stroke-width="2"/>
  </g>

  <!-- Personne 2 -->
  <g transform="translate(115,100)">
    <circle cx="0" cy="-42" r="11" fill="#ffffff" opacity="0.8"/>
    <path d="M-11,-31 Q0,-18 11,-31 L14,4 Q0,10 -14,4 Z" fill="#ffffff" opacity="0.7"/>
    <line x1="-14" y1="-8" x2="-26" y2="-22" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="14" y1="-8" x2="26" y2="2" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Personne 3 -->
  <g transform="translate(165,92)">
    <circle cx="0" cy="-44" r="12" fill="#5BD988" opacity="0.8"/>
    <path d="M-12,-32 Q0,-19 12,-32 L15,5 Q0,11 -15,5 Z" fill="#5BD988" opacity="0.7"/>
    <!-- Les deux bras levés -->
    <line x1="-15" y1="-8" x2="-30" y2="-24" stroke="#5BD988" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="15" y1="-8" x2="30" y2="-24" stroke="#5BD988" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Confettis -->
  <rect x="80" y="30" width="6" height="6" fill="#FFD700" rx="1" transform="rotate(25,83,33)"/>
  <rect x="140" y="20" width="5" height="5" fill="#5BD988" rx="1" transform="rotate(45,142,22)"/>
  <rect x="200" y="35" width="6" height="6" fill="#FF6B6B" rx="1" transform="rotate(15,203,38)"/>
  <rect x="100" y="55" width="4" height="4" fill="#FFD700" rx="1" transform="rotate(60,102,57)"/>
  <rect x="175" y="50" width="5" height="5" fill="#ffffff" rx="1" transform="rotate(30,177,52)" opacity="0.6"/>
  <circle cx="220" cy="25" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="90" cy="70" r="2.5" fill="#5BD988" opacity="0.7"/>
  <circle cx="155" cy="60" r="2" fill="#FF6B6B" opacity="0.8"/>

  <!-- Banderole -->
  <path d="M30,75 Q60,65 90,75 Q120,85 150,75 Q180,65 210,75" stroke="#FFD700" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Petits triangles banderole -->
  <polygon points="45,74 52,74 48,84" fill="#FFD700" opacity="0.7"/>
  <polygon points="75,75 82,75 78,85" fill="#5BD988" opacity="0.7"/>
  <polygon points="105,76 112,76 108,86" fill="#FF6B6B" opacity="0.7"/>
  <polygon points="135,75 142,75 138,85" fill="#FFD700" opacity="0.7"/>
  <polygon points="165,74 172,74 168,84" fill="#5BD988" opacity="0.7"/>
  <polygon points="195,75 202,75 198,85" fill="#ffffff" opacity="0.5"/>

  <!-- Textes -->
  <text x="24" y="130" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#FFD700" letter-spacing="-0.5">Bonne Fête</text>
  <text x="24" y="153" font-family="'Georgia', serif" font-size="22" font-weight="700" fill="#ffffff">du Travail !</text>
  <text x="24" y="175" font-family="Arial, sans-serif" font-size="12" fill="#5BD988" font-weight="600">1er Mai 2026 • Ubipharm</text>

  <!-- Étoiles décoratives -->
  <text x="238" y="158" font-size="18" fill="#FFD700" opacity="0.8">★</text>
  <text x="262" y="140" font-size="12" fill="#FFD700" opacity="0.5">★</text>
  <text x="250" y="175" font-size="10" fill="#5BD988" opacity="0.6">★</text>
</svg>
